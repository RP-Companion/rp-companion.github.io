<style>
:root{--bg:#111613;--panel:#1b211c;--panel2:#202820;--ink:#eee8d8;--mute:#9e9d8e;--line:#3b4135;--acc:#d3ad70;--acc2:#98794f;--accbg:#312c21;--bad:#cf8273;--ok:#8fa782;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(171,137,82,.16),transparent 43%),radial-gradient(ellipse at 0% 60%,rgba(104,112,79,.08),transparent 38%),var(--bg);color:var(--ink);font:15px/1.65 Manrope,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
main{max-width:760px;margin:0 auto;padding:28px 22px 90px;position:relative}
main:before{content:"";position:fixed;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--acc2),transparent);opacity:.65;pointer-events:none}
h1,h2{font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;margin:0;font-weight:600;letter-spacing:.025em}h1{font-size:clamp(32px,7.5vw,45px);line-height:1.02;letter-spacing:.035em}h2{font-size:30px;line-height:1.1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 28px;padding:0 0 20px;border-bottom:1px solid var(--line);position:relative}
header:after{content:"✦";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);padding:0 10px;background:var(--bg);color:var(--acc2);font-size:13px}
button,input,textarea,select{font:inherit;color:inherit}button{background:linear-gradient(150deg,rgba(255,255,255,.045),transparent),var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 15px;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;box-shadow:0 3px 14px rgba(0,0,0,.08)}button:hover{transform:translateY(-1px);border-color:var(--acc2)}button:active{transform:translateY(0)}button.p{background:linear-gradient(135deg,#dfc18d,#b9955b);border-color:#d1ad75;color:#171914;font-weight:700;box-shadow:0 5px 22px rgba(187,147,83,.2)}button.d{color:var(--bad)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
input,textarea,select{width:100%;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}input::placeholder,textarea::placeholder{color:var(--mute);opacity:.72}textarea{min-height:110px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 55%),color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 12px 32px rgba(0,0,0,.09)}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.row>.s{flex:0 0 auto}.ch{display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%;text-align:left}
.badge{background:var(--accbg);color:var(--acc);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;letter-spacing:.04em}.tabs{display:flex;gap:7px;overflow-x:auto;margin:10px 0 18px;padding:5px 1px 10px;scrollbar-width:thin}.tabs button{flex:0 0 auto}.tabs button[aria-selected=true]{background:var(--accbg);color:var(--acc);border-color:var(--acc2);box-shadow:inset 0 -2px var(--acc)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#b6be87)}.mute{color:var(--mute);font-size:13px}.gen{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;line-height:1.35}.empty{text-align:center;padding:48px 22px;color:var(--mute);background:radial-gradient(ellipse at center,rgba(211,173,112,.07),transparent 70%);border:1px dashed color-mix(in srgb,var(--acc2) 55%,var(--line));border-radius:18px;margin:18px 0 14px}.empty:before{content:"✧";display:block;color:var(--acc);font-size:30px;line-height:1;margin-bottom:12px}.log{border-left:2px solid var(--acc2);padding:4px 0 4px 14px;margin:12px 0}.ans{white-space:pre-wrap}details{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}summary{cursor:pointer;color:var(--mute)}
@media(max-width:520px){main{padding:18px 15px 70px}header{margin-bottom:22px}header button{padding:9px 12px;font-size:13px}.brand-mark{width:35px;height:35px}.brand{gap:9px}.brand-note{font-size:8px}.welcome{min-height:260px;padding:25px 22px}.welcome-seal{flex-basis:86px;height:110px;opacity:.76}.seal-ring{width:78px;height:78px;outline-offset:4px}.seal-ring b{font-size:7px}.seal-ring i{font-size:15px}.seal-ring span{font-size:13px}.seal-ring small{font-size:7px}.welcome p{font-size:13px}.card{padding:15px;border-radius:14px}.row{gap:7px}.tabs{margin-bottom:14px}}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--acc2);border-radius:50%;color:var(--acc);font-size:21px;box-shadow:0 0 24px rgba(211,173,112,.12)}.brand-note{display:block;color:var(--mute);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}.welcome{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:290px;margin:10px 0 22px;padding:34px;border:1px solid color-mix(in srgb,var(--acc2) 60%,var(--line));border-radius:22px;background:radial-gradient(ellipse at 82% 48%,rgba(187,152,95,.18),transparent 34%),linear-gradient(115deg,rgba(31,39,31,.94),rgba(25,30,25,.74)),var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.18)}:root[data-theme="light"] .welcome{background:radial-gradient(ellipse at 82% 48%,rgba(157,120,62,.16),transparent 35%),linear-gradient(115deg,#e4ddce,#f1ecdf)}.welcome:after{content:"";position:absolute;inset:10px;border:1px solid rgba(211,173,112,.12);border-radius:15px;pointer-events:none}.welcome-copy{position:relative;z-index:1;max-width:400px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--acc);font-weight:700;margin-bottom:16px}.eyebrow span{display:inline-block;width:16px;height:1px;background:var(--acc);vertical-align:middle;margin-right:7px}.welcome h2{font-size:clamp(38px,8vw,54px);line-height:.96}.welcome p{max-width:340px;color:var(--mute);margin:15px 0 22px;font-size:14px}.welcome-cta{display:flex;gap:22px;align-items:center}.welcome-cta span{font-size:17px}.welcome-seal{flex:0 0 155px;height:155px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(211,173,112,.13),transparent 67%);color:var(--acc);transform:rotate(-9deg)}.seal-ring{width:122px;height:122px;border:1px solid rgba(211,173,112,.52);outline:1px solid rgba(211,173,112,.2);outline-offset:6px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 30px rgba(211,173,112,.08)}.seal-ring span{font-size:18px}.seal-ring b{font:600 10px Manrope,sans-serif;letter-spacing:.22em}.seal-ring i{font-style:normal;font-size:21px;line-height:1}.seal-ring small{font:600 9px Manrope,sans-serif;letter-spacing:.2em;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

var KEY="rp-companion-v1",S=[],cur=null,tab="main",out="",view="home",AI=null,busy=false,ans="",CFG={m:"gpt-5.4-nano"},PUSER="";

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function aiError(e){var m=(e&&(e.message||e.msg||e.error))||"ИИ-помощник временно недоступен.";if(/402|insufficient_funds/i.test(String(m)))return"Похоже, лимит или баланс Puter исчерпан. Попробуйте позже или выберите другую модель; приложение работает и без ИИ.";if(/429|rate.?limit|too many requests|quota/i.test(String(m)))return"Puter временно ограничил запросы. Попробуйте позже; приложение работает и без ИИ.";return String(m)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ch(){return S.find(function(c){return c.id===cur})}
var NAMES={
  "Богемия 1403 (KCD2)":{f:["Ян","Мартин","Вацлав","Прокоп","Збынек","Ондржей","Матей","Йиндржих","Агнеша","Анежка","Катержина","Зденка"],l:["из Кутной Горы","Кованый","Мельник","Рудокоп","из Седлеца","Безземельный","Седой","Хромой"]}
};
var LINES={
  "Богемия 1403 (KCD2)":{"Приветствие":["Бог в помощь, добрый человек. Чего ищешь в наших краях?","Откуда путь держишь? Времена нынче неспокойные.","Добрый день. Не подскажешь, где здесь найти постоялый двор?","Мир дому этому. Есть ли у вас работа для честных рук?","Путник, не слыхал ли ты новостей из Кутной Горы?","Что привело тебя в наши края — торговля или беда?"],"Угроза":["Шагай мимо, пока цел. Здесь тебе не рады.","Закон тут я, а не пан в замке.","Не хватайся за меч. У ворот стражи больше, чем тебе друзей.","Ещё слово — и отвечать будешь перед паном.","Убирайся с дороги. Терпение у меня не бездонное.","Я тебя предупредил. Второго раза не будет."],"Торг":["Грош к грошу, так и живём. Три гроша, и ни крейцаром меньше.","Серебро нынче в цене, друг. Дешевле не отдам.","Для доброго покупателя найду цену получше.","Товар честный, без обмана. Осмотри сам.","Могу уступить немного, если возьмёшь всё сразу.","На рынке дешевле не сыщешь — даю слово."],"Слух":["Говорят, на дороге к Седлецу снова шалят разбойники.","Шахтёры ропщут: серебра стало меньше, а подати прежние.","У переправы видели чужих всадников. Никто не знает, чьи они.","В трактире шепчутся о пропавшем обозе из Кутной Горы.","Пан собирает людей. Поговаривают, неспроста.","На дороге нашли брошенную телегу — лошадей и возницу как ветром сдуло."]}
};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function newChar(){var c={id:uid(),name:"Новый персонаж",faction:"",status:"",backstory:"",hp:10,hpMax:10,res:[],rel:[],notes:""};S.unshift(c);cur=c.id;tab="main";save();render()}
function render(){var a=document.getElementById("app");a.innerHTML=(cur&&ch()?sheet():list())}
function list(){
 var h='<header><div class="brand"><span class="brand-mark">✦</span><div><h1>RP Companion</h1><span class="brand-note">Личный журнал персонажа</span></div></div><button class="p" onclick="newChar()">＋ Новый персонаж</button></header>';
 if(!S.length)h+='<section class="welcome"><div class="welcome-copy"><div class="eyebrow"><span></span> БОГЕМИЯ · 1403</div><h2>Твоя история<br>начинается здесь</h2><p>Создай героя, запиши его связи и важные события. Всё нужное для игры — в одном месте.</p><button class="p welcome-cta" onclick="newChar()">Создать персонажа <span>↗</span></button></div><div class="welcome-seal" aria-hidden="true"><div class="seal-ring"><span>✦</span><b>BOHEMIA</b><i>◈</i><small>1403</small></div></div></section>';
 S.forEach(function(c){h+='<div class="card"><button class="ch" style="border:0;padding:0;background:none" onclick="cur=\''+c.id+'\';tab=\'main\';render()"><span><b>'+esc(c.name)+'</b><br><span class="mute">'+esc(c.faction||"Без фракции")+'</span></span></button></div>'});
 h+='<div class="card"><b>Копия данных</b><p class="mute">Данные хранятся только в этом браузере. Скопируйте их, чтобы не потерять.</p><div class="row"><button onclick="exp()">Показать копию</button><button onclick="imp()">Восстановить</button></div><textarea id="bk" placeholder="Здесь появится копия или вставьте её для восстановления"></textarea></div>';
 h+=puterui();return h}
function exp(){document.getElementById("bk").value=JSON.stringify(S)}
function imp(){try{var v=JSON.parse(document.getElementById("bk").value);if(!Array.isArray(v))throw 0;S=v;save();render()}catch(e){alert("Не получилось прочитать копию. Вставьте текст целиком.")}}
function sheet(){
 var c=ch(),T=[["main","Основное"],["rel","Связи"],["log","Журнал"],["ask","Спросить"],["notes","Заметки"],["gen","Генератор"]];
 var h='<header><button onclick="cur=null;render()">Назад</button><h2>'+esc(c.name)+'</h2><button class="d" onclick="del()">Удалить</button></header><div class="tabs" role="tablist">';
 T.forEach(function(t){h+='<button role="tab" aria-selected="'+(tab===t[0])+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'});
 h+='</div>';
 if(tab==="main")h+='<label>Имя</label><input value="'+esc(c.name)+'" oninput="up(\'name\',this.value)"><label>Фракция</label><input value="'+esc(c.faction)+'" oninput="up(\'faction\',this.value)"><label>Статус</label><input value="'+esc(c.status)+'" placeholder="Например: в розыске, ранен, на задании" oninput="up(\'status\',this.value)"><label>Квента</label><textarea oninput="up(\'backstory\',this.value)">'+esc(c.backstory)+'</textarea>'+bioui();

function mkAI(){var a=async function(P){
 if(!window.puter||!window.puter.ai)throw new Error("Puter пока не загрузился. Проверьте интернет и обновите страницу.");

 var t=r&&r.message?r.message.content:"";
 if(typeof t!=="string"||!t.trim())throw new Error("Пустой ответ. Попробуйте ещё раз.");
 return{text:t.trim()}};
 a.json=async function(P){var r=await a(P);return JSON.parse(r.text.replace(/```json|```/g,"").trim())};return a}
